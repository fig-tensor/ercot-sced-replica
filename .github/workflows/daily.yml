name: daily
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run newest disclosed day
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_PUBLIC_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_PUBLIC_API_SUBSCRIPTION_KEY }}
        run: uv run scedrep "$(date -u -d '61 days ago' +%Y-%m-%d)"
      - name: Save today's unplanned outage report
        continue-on-error: true
        run: uv run python -c "from scedrep.fetch import save_unplanned_outages; save_unplanned_outages('$(TZ=America/Chicago date +%Y-%m-%d)')"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Daily run $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push