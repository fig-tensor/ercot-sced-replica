[project]
name = "scedrep"
version = "0.6.0"                       # matches the latest release tag
description = "Open, validated nodal model of ERCOT real-time SCED, built from public data"
readme = "README.md"
license = "MIT"                         # SPDX expression; shows on GitHub and any package index
license-files = ["LICENSE"]
authors = [
    { name = "fig-tensor", email = "353080086+fig-tensor@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["ercot", "sced", "electricity markets", "lmp", "congestion", "pyomo", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "gridstatus>=0.37.0",
    "highspy>=1.15.1",
    "pandas>=2.3.3",
    "piqp>=0.8.0,<0.9",
    "pyomo>=6.10.1",
    "scikit-learn>=1.9.1",
]

[project.urls]
Repository = "https://github.com/fig-tensor/ercot-sced-replica"

[project.scripts]
scedrep = "scedrep:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
